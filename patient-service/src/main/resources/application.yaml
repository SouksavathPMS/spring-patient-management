logging:
  level:
    root: info

springdoc:
  swagger-ui:
    path: /api-docs
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /api-docs/json
  packages-to-scan: com.pm.patient_service


server:
  port: 4000


